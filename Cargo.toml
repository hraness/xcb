[workspace]
members = ["crates/xcb-platform", "crates/xcb-core", "crates/xcb-runtime", "crates/xcb-tui", "crates/xcb-cli"]
resolver = "3"

[workspace.package]
version = "0.14.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 2
# Dependency backtraces keep file and line; full dependency debuginfo made
# every local and CI target directory several GB larger for no daily use.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# CI's native build: the release settings without the single-unit thin-LTO
# link, which cost 2-3 minutes per build even with every dependency cached.
# Tagged releases (release.yml) still build the `release` profile cold.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
