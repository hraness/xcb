[package]
name = "xcb-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "=0.11.1"
aicharts-core = { git = "https://github.com/hraness/aicharts", rev = "091433796f7253386c3e3186c67c275fb273b704", version = "0.1.0" }
algal = { git = "https://github.com/hraness/algal", rev = "14915465c3d7c5ee2c55e2977e36ee03f6bcbff0", version = "0.2.0" }
base64 = "=0.23.1"
convex = "=0.10.4"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
p256 = { version = "=0.14.0", features = ["ecdh", "ecdsa", "sha256"] }
gobstopper-core = { git = "https://github.com/hraness/gobstopper", rev = "d856594fb6cf9e23e4cef2d28eb6dc0cdf4b7030", version = "0.2.1" }
hex = "=0.4.3"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "signal"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }
webpki-roots = "=1.0.9"
xcb-core = { version = "0.17.5", path = "../xcb-core" }
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
# The shared custody crate and rustix's fs/process modules are Unix-only;
# Windows custody lives in xcb-platform.
local-custody = { git = "https://github.com/hraness/local-custody", rev = "4fd65854da14c80f47ba45ea2ae091732c37fba9", version = "0.6.0" }
rustix = { version = "=1.1.5", features = ["fs", "process", "pty", "termios"] }

[target.'cfg(windows)'.dependencies]
xcb-platform = { version = "0.17.5", path = "../xcb-platform" }
