name: Dependency audit

# Scheduled advisory scan of the locked dependency graphs. It is read-only:
# no release authority, no tokens beyond the default read-only GITHUB_TOKEN,
# and it never runs on pull requests or pushes.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo_audit:
    name: cargo audit (Cargo.lock)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          toolchain: 1.97.1
      - name: Install the pinned cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2
      - name: Audit the native dependency lock
        run: cargo audit

  bun_audit:
    name: bun audit (${{ matrix.directory }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "site"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Audit the JavaScript dependency lock
        run: bun audit
        working-directory: ${{ matrix.directory }}
